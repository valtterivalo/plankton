[project]
name = "plankton-hooks"
dynamic = ["version"]
description = "write-time code quality enforcement for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Alex Fazio", email = "alex@alexfazio.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/alexfazio/plankton"
Repository = "https://github.com/alexfazio/plankton"
Issues = "https://github.com/alexfazio/plankton/issues"

[project.scripts]
plankton = "plankton_hooks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/plankton_hooks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plankton_hooks"]
# _embedded/ contains hook scripts and linter configs copied from the repo root.
# to update: run the sync commands in the repo README, or copy files manually.
# the canonical sources live at .claude/hooks/ and the repo root config files.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
    "T201",   # print is fine in a CLI tool
]

[tool.ruff.lint.pydocstyle]
convention = "google"
