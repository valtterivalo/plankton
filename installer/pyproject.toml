[project]
name = "plankton-hooks"
version = "0.1.0"
description = "write-time code quality enforcement for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
]

[project.scripts]
plankton = "plankton_hooks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plankton_hooks"]
# _embedded/ contains hook scripts and linter configs copied from the repo root.
# to update: run the sync commands in the repo README, or copy files manually.
# the canonical sources live at .claude/hooks/ and the repo root config files.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
    "T201",   # print is fine in a CLI tool
]

[tool.ruff.lint.pydocstyle]
convention = "google"
